title = "Other Birds"
baseURL = "https://otherbirds.netlify.app/"

defaultContentLanguage = "en"
locale = "en"
enableRobotsTXT = true
enableEmoji = true
timeout = "120s"
copyright = "Thomas Evensen - all photos are copyrighted by law"

[params]
  defaultTheme = "dark"
  description = "Wildlife photography by Thomas Evensen"
  title = "Other Birds"
  [params.author]
    name = "Thomas Evensen"
    email = "thomeven@gmail.com"
  [params.socialIcons]
    email = "mailto:thomeven@gmail.com"
  [params.gallerydeluxe]
    shuffle = false
    reverse = false
    # Keep disabled: the gallery currently exposes unfiltered camera metadata.
    enable_exif = false

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML"]

[build]
  [[build.cacheBusters]]
    source = 'content/.*\.(png|jpg|jpeg)'
    target = '(json)'
  [[build.cacheBusters]]
    source = 'layouts/.*'
    target = '(json)'

[imaging]
  quality = 82
  resampleFilter = "CatmullRom"
  [imaging.exif]
    disableDate = false
    disableLatLong = true
    includeFields = 'Artist|LensModel|FNumber|ExposureTime|ISOSpeedRatings|FocalLength'

[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.imports]]
    path = "github.com/bep/gallerydeluxe"

[menu]
  [[menu.footer]]
    name = "About"
    url = "/about/"
    weight = 1
